<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <link rel="stylesheet" href="../classic-games.css">
</head>
<body>
  <main class="game">
    <h1>Snake</h1>
    <p>Raccogli le mele senza urtare i bordi o la coda.</p>
    <div class="game-bar"><span class="score">Punteggio: <span id="score">0</span></span><button id="restart" type="button">Nuova partita</button></div>
    <canvas class="playfield" id="board" width="400" height="400" tabindex="0" aria-label="Campo di gioco di Snake"></canvas>
    <div class="pad" aria-label="Controlli direzionali">
      <button class="up" data-direction="up" aria-label="Su">↑</button>
      <button class="left" data-direction="left" aria-label="Sinistra">←</button>
      <button class="down" data-direction="down" aria-label="Giù">↓</button>
      <button class="right" data-direction="right" aria-label="Destra">→</button>
    </div>
    <p class="message" id="message" role="status">Premi una freccia o tocca un pulsante per iniziare.</p>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
