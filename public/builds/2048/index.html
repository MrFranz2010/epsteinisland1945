<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <link rel="stylesheet" href="../classic-games.css">
</head>
<body>
  <main class="game">
    <h1>2048</h1>
    <p>Unisci le tessere con lo stesso numero fino ad arrivare a 2048.</p>
    <div class="game-bar"><span class="score">Punteggio: <span id="score">0</span></span><button id="restart" type="button">Nuova partita</button></div>
    <div class="board" id="board" role="group" aria-label="Tabellone 2048"></div>
    <p class="message" id="message" role="status">Usa le frecce, WASD o scorri sul tabellone.</p>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
