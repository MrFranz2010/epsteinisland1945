<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1ebdf">
  <meta name="description" content="Volo libero tra palazzi con collisioni, visuale FPV e controller.">
  <title>Urban FPV</title>
  <link rel="stylesheet" href="../../assets/site.css">
  <script src="../../assets/theme.js"></script>
  <script type="module" src="../../assets/player.js"></script>
</head>
<body data-game="urban-fpv">
  <header class="site-header">
    <a class="brand" href="../../" aria-label="Epstein island, home"><span class="brand-mark" aria-hidden="true">↗</span> EPSTEIN ISLAND</a>
    <a class="header-link" href="../../">← Tutti i giochi</a>
  </header>
  <main>
    <section class="intro">
      <p class="eyebrow" id="gameCategory">Simulazione</p>
      <h1 id="gameTitle">URBAN FPV<span class="accent">.</span></h1>
    </section>
    <section class="game-shell" id="gameShell" aria-label="Area di gioco">
      <div class="game-toolbar">
        <div class="game-label"><span class="status-dot" aria-hidden="true"></span><span id="gameStatus" role="status">Pronto a volare</span></div>
        <div class="toolbar-actions">
          <button id="reloadBtn" type="button" disabled>Ricarica gioco</button>
          <button class="primary" id="fullscreenBtn" type="button" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span id="fullscreenText">Schermo intero</span></button>
        </div>
      </div>
      <div class="game-stage" id="gameStage">
        <iframe id="gameFrame" title="Gioco" allow="fullscreen; gamepad; autoplay" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-downloads" allowfullscreen hidden></iframe>
        <div class="placeholder" id="placeholder">
          <div class="placeholder-inner">
            <h2 id="stageTitle">Pronto a volare?</h2>
            <p id="stageDescription">Volo libero tra palazzi con controller e visuale FPV.</p>
            <button class="primary" id="playBtn" type="button">Gioca ora <span aria-hidden="true">→</span></button>
            <a class="button-link" id="externalPlayLink" target="_blank" rel="noopener noreferrer" hidden>Apri su itch.io ↗</a>
          </div>
        </div>
      </div>
      <p class="player-note" id="loadNotice" role="status" hidden></p>
    </section>
    <p class="credits" id="gameCredits"></p>
    <nav class="related-games" aria-label="Altri giochi"><h2>Continua a giocare</h2><div id="relatedGames"></div><a class="button-link" href="../../">← Torna al catalogo</a></nav>
  </main>
  <footer>Epstein island · Raccolta non ufficiale. Ogni gioco appartiene ai rispettivi autori.</footer>
</body>
</html>
